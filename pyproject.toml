[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-likeliness-v3"
version = "0.1.0"
description = "Reproducible drug-likeness research pipeline"
requires-python = ">=3.13,<3.14"

dependencies = [
    "pandas",
    "pyyaml",
    "rdkit",
    "requests",
    "scikit-learn",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"