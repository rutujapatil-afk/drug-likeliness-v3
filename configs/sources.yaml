sources:

  - id: drugcentral
    name: DrugCentral
    role: positive_reference
    source_type: drug_database

    url: https://drugcentral.org/download
    license:
      type: Creative Commons
      verified: true

    structure_fields:
      smiles: true
      inchi: true

    identifiers:
      drugcentral_id: true

    label:
      type: reference_membership
      value: 1
      meaning: drug_reference

    download:
      status: acquired

    notes:
      - "Used as the initial positive/reference drug source."
      - "Exact downloaded version must be recorded."
      - "Original source structures must be preserved."
      - "Local file: data/raw/structures.smiles.tsv"
      - "Provenance metadata: data/raw/drugcentral_metadata.json"

  - id: chebi_negative_reference
    name: ChEBI negative reference
    role: negative_reference
    source_type: chemical_ontology

    url: https://www.ebi.ac.uk/chebi/downloads

    license:
      type: Creative Commons Attribution 4.0 International
      verified: true

    structure_fields:
      smiles: true
      inchi: true
      inchikey: true

    identifiers:
      chebi_id: true

    label:
      type: reference_membership
      value: 0
      meaning: non_drug_reference

    inclusion_rule:
      - "ChEBI compound has a valid molecular structure."
      - "ChEBI compound has no drug-role annotation."
      - "ChEBI compound does not overlap DrugCentral by canonical SMILES."

    download:
      status: pending

    notes:
      - "Negative reference source selected for the binary structure-based classification task."
      - "Negative membership is source-defined and is not equivalent to proof of non-drug status."
      - "DrugCentral structural overlap must be excluded before labeling."