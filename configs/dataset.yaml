project:
  name: drug-likeliness-v3
  task: binary_classification

target:
  name: drug_likeness
  type: binary

classes:
  positive:
    value: 1
    name: drug_reference

  negative:
    value: 0
    name: non_drug_reference

  negative_source: to_be_defined

molecular_representation:
  input: smiles
  standardized: canonical_smiles
  toolkit: rdkit

provenance:
  preserve_original_smiles: true
  preserve_source_id: true
  preserve_source_dataset: true

duplicates:
  identity_field: canonical_smiles
  automatic_label_resolution: false

splitting:
  strategy: to_be_defined

data_leakage:
  prevent_cross_partition_information: true

research_question:
  type: structure_based_binary_classification
  biological_activity_prediction: false
  clinical_approval_prediction: false